<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Частота 4625</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main-menu">

        <div class="menu-panel">

            <p class="game-subtitle">РАДИОСТАНЦИЯ · ОБЪЕКТ 4625</p>

            <h1>Последний<br>сигнал</h1>

            <div class="separator"></div>

            <nav class="menu-buttons">

                <button id="new-game">
                    <span class="cursor">&gt;</span>
                    Новая смена
                </button>

                <button id="continue-game">
                    <span class="cursor"></span>
                    Продолжить
                </button>

                <button id="settings">
                    <span class="cursor"></span>
                    Настройки
                </button>

            </nav>

            <p class="version">BUILD 0.1 · СИГНАЛ НЕ ПРЕРЫВАТЬ</p>

        </div>

        <div class="signal">
            <span class="signal-light"></span>
            АКТИВНЫЙ СИГНАЛ
        </div>

    </main>

    <script src="game.js"></script>

</body>
</html>
